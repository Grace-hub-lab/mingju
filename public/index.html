<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f5efe3" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#1c1915" media="(prefers-color-scheme: dark)" />
  <meta name="description" content="名著里的经典句子，按书浏览、搜索、收藏" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="名著金句" />
  <meta name="format-detection" content="telephone=no" />
  <title>名著金句</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" type="image/png" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="app-header">
    <h1>名著金句</h1>
    <p class="subtitle" id="subtitle"></p>
  </header>

  <main>
    <!-- ===== 今日 ===== -->
    <section id="panel-today" class="panel" role="tabpanel" aria-labelledby="tab-today">
      <p class="date-line" id="today-date"></p>
      <div id="today-card"></div>
      <div class="today-actions">
        <button type="button" id="random-btn" class="primary">🎲 随机一句</button>
        <button type="button" id="back-today-btn" class="ghost" hidden>回到今日一句</button>
      </div>
    </section>

    <!-- ===== 书库 ===== -->
    <section id="panel-library" class="panel" role="tabpanel" aria-labelledby="tab-library" hidden>
      <div id="library-home">
        <div class="chips" id="region-chips" role="group" aria-label="地区筛选">
          <button type="button" class="chip" data-region="all" aria-pressed="true">全部</button>
          <button type="button" class="chip" data-region="cn" aria-pressed="false">中国</button>
          <button type="button" class="chip" data-region="world" aria-pressed="false">外国</button>
        </div>
        <ul id="book-grid" class="book-grid"></ul>
      </div>
      <div id="book-detail" hidden>
        <button type="button" id="book-back" class="ghost small">‹ 返回书库</button>
        <div class="book-head">
          <h2 id="book-title"></h2>
          <p id="book-meta" class="muted"></p>
        </div>
        <div id="book-quotes"></div>
      </div>
    </section>

    <!-- ===== 搜索 ===== -->
    <section id="panel-search" class="panel" role="tabpanel" aria-labelledby="tab-search" hidden>
      <div class="search-bar">
        <label for="search-input" class="sr-only">搜索名句、书名或作者</label>
        <input id="search-input" class="text-input" type="search"
          placeholder="🔍 搜句子、书名、作者……" autocomplete="off" />
      </div>
      <div class="chips suggest" id="suggest-chips" role="group" aria-label="热门关键词"></div>
      <p id="search-count" class="muted small-text" aria-live="polite"></p>
      <div id="search-results"></div>
    </section>

    <!-- ===== 收藏 ===== -->
    <section id="panel-favs" class="panel" role="tabpanel" aria-labelledby="tab-favs" hidden>
      <p id="favs-count" class="muted small-text"></p>
      <div id="favs-list"></div>
      <p id="favs-empty" class="muted center empty">还没有收藏，看到喜欢的句子点一下 ♡ 吧</p>
    </section>

    <footer class="footer">外国作品为常见中译本文字，不同译本措辞可能略有差异</footer>
  </main>

  <!-- 底部导航 -->
  <nav class="bottom-nav" role="tablist" aria-label="主导航">
    <button role="tab" id="tab-today" data-tab="today" aria-controls="panel-today" aria-selected="true" class="nav-item active">
      <span class="nav-icon" aria-hidden="true">☀️</span><span>今日</span>
    </button>
    <button role="tab" id="tab-library" data-tab="library" aria-controls="panel-library" aria-selected="false" class="nav-item">
      <span class="nav-icon" aria-hidden="true">📚</span><span>书库</span>
    </button>
    <button role="tab" id="tab-search" data-tab="search" aria-controls="panel-search" aria-selected="false" class="nav-item">
      <span class="nav-icon" aria-hidden="true">🔍</span><span>搜索</span>
    </button>
    <button role="tab" id="tab-favs" data-tab="favs" aria-controls="panel-favs" aria-selected="false" class="nav-item">
      <span class="nav-icon" aria-hidden="true">❤️</span><span>收藏</span>
    </button>
  </nav>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="quotes.js"></script>
  <script src="app.js"></script>
</body>
</html>
